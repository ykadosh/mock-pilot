name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which section of the app does this relate to?
      options:
        - Editor
        - Capture Browser
        - Assets
        - AI
        - General
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Effort Size
      description: Estimated effort to fix
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, logs, or anything else that might help
    validations:
      required: false
